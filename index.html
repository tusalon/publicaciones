<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1D1F" media="(prefers-color-scheme: dark)">
<title>Publicaciones · RservasRoma</title>
<link rel="icon" href="icono-64.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#FFFAF7;--card:#fff;--tx:#1D1D1F;--gris:#6E6E73;--linea:#E5E2E0;--rosa:#FB6095;--btn:#CF2D5E;--btn-tx:#fff;--suave:#FFF3F6;--pre:#F7F0EC}
@media (prefers-color-scheme:dark){:root{--bg:#141415;--card:#1F1F22;--tx:#F5F5F7;--gris:#A1A1A6;--linea:#2E2E32;--suave:#2A1A20;--pre:#18181A}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
header{max-width:720px;margin:0 auto;padding:22px 0 14px;display:flex;align-items:center;gap:14px}
header img{width:48px;height:48px;border-radius:12px}
header h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
header p{font-size:14px;color:var(--gris)}
main{max-width:720px;margin:0 auto}
#buscar{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--linea);background:var(--card);color:var(--tx);font-size:16px;padding:0 16px;margin-bottom:14px}
#buscar:focus{outline:none;border-color:var(--rosa)}
.pub{background:var(--card);border:1px solid var(--linea);border-radius:18px;margin-bottom:12px;overflow:hidden}
.pub summary{list-style:none;cursor:pointer;padding:16px;display:flex;gap:12px;align-items:flex-start;min-height:48px}
.pub summary::-webkit-details-marker{display:none}
.pub summary .tx{flex:1;min-width:0}
.pub summary b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.meta{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:13px;color:var(--gris)}
.tipo{font-size:12px;font-weight:700;color:var(--btn);background:var(--suave);padding:2px 10px;border-radius:999px}
@media (prefers-color-scheme:dark){.tipo{color:var(--rosa)}}
.flecha{flex:none;width:24px;height:24px;margin-top:2px;transition:transform .2s;color:var(--gris)}
.pub[open] .flecha{transform:rotate(180deg)}
.cuerpo{padding:0 16px 16px;border-top:1px solid var(--linea)}
.archivo{font-size:13px;color:var(--gris);padding-top:12px;word-break:break-word}
.bloque{margin-top:14px}
.bloque .cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.bloque h3{font-size:14px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.04em}
.bloque pre{white-space:pre-wrap;word-wrap:break-word;font:15px/1.5 inherit;font-family:inherit;background:var(--pre);border-radius:12px;padding:14px;user-select:text;-webkit-user-select:text}
button{font:inherit;cursor:pointer;border:none}
.copiar{flex:none;min-width:96px;height:44px;border-radius:999px;background:var(--btn);color:var(--btn-tx);font-size:15px;font-weight:700;padding:0 18px}
.copiar:active{transform:scale(.97)}
.copiar.ok{background:#15803D}
.todo{width:100%;height:48px;border-radius:999px;background:transparent;border:2px solid var(--btn);color:var(--btn);font-size:15px;font-weight:700;margin-top:16px}
@media (prefers-color-scheme:dark){.todo{border-color:var(--rosa);color:var(--rosa)}}
.vacio{text-align:center;color:var(--gris);padding:40px 0}
#aviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);font-size:15px;font-weight:600;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}
#aviso.ver{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <img src="icono-180.png" alt="" width="48" height="48">
  <div><h1>Publicaciones</h1><p>Textos listos para copiar y pegar</p></div>
</header>
<main>
  <input id="buscar" type="search" placeholder="Buscar por título o texto" aria-label="Buscar publicaciones">
  <div id="lista"><p class="vacio">Cargando…</p></div>
</main>
<div id="aviso" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
var lista=document.getElementById("lista"),buscar=document.getElementById("buscar"),aviso=document.getElementById("aviso"),pubs=[];
var FLECHA='<svg class="flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fecha(f){var d=new Date(f+"T12:00:00");return d.toLocaleDateString("es",{day:"numeric",month:"short",year:"numeric"})}
function copiar(texto,boton){
  var hecho=function(){avisar("Copiado");if(boton){var t=boton.textContent;boton.textContent="Copiado ✓";boton.classList.add("ok");setTimeout(function(){boton.textContent=t;boton.classList.remove("ok")},1600)}};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(texto).then(hecho,function(){viejo(texto)&&hecho()})}
  else if(viejo(texto))hecho();
}
function viejo(texto){
  var a=document.createElement("textarea");a.value=texto;a.setAttribute("readonly","");a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(a);
  if(!ok)avisar("No se pudo copiar: mantén pulsado el texto");return ok;
}
var tAviso;function avisar(m){aviso.textContent=m;aviso.classList.add("ver");clearTimeout(tAviso);tAviso=setTimeout(function(){aviso.classList.remove("ver")},1500)}
function pintar(){
  var q=buscar.value.trim().toLowerCase();
  var vis=pubs.filter(function(p){return !q||(p.titulo+" "+p.bloques.map(function(b){return b.texto}).join(" ")).toLowerCase().indexOf(q)>-1});
  if(!vis.length){lista.innerHTML='<p class="vacio">No hay publicaciones con ese texto.</p>';return}
  lista.innerHTML=vis.map(function(p,i){
    var pi=pubs.indexOf(p);
    return '<details class="pub"'+(i===0&&!q?" open":"")+'><summary><div class="tx"><b>'+esc(p.titulo)+'</b><div class="meta"><span class="tipo">'+esc(p.tipo)+'</span><span>'+fecha(p.fecha)+'</span></div></div>'+FLECHA+'</summary><div class="cuerpo">'+
      (p.archivo?'<p class="archivo">Archivo: '+esc(p.archivo)+'</p>':'')+
      p.bloques.map(function(b,j){return '<div class="bloque"><div class="cab"><h3>'+esc(b.nombre)+'</h3><button class="copiar" data-p="'+pi+'" data-b="'+j+'">Copiar</button></div><pre>'+esc(b.texto)+'</pre></div>'}).join("")+
      (hayTodo(p)?'<button class="todo" data-p="'+pi+'" data-todo="1">Copiar texto + hashtags</button>':'')+
      '</div></details>';
  }).join("");
}
function hayTodo(p){return bloque(p,"Texto de la publicación")&&bloque(p,"Hashtags")}
function bloque(p,n){for(var i=0;i<p.bloques.length;i++)if(p.bloques[i].nombre===n)return p.bloques[i];return null}
lista.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var p=pubs[+b.dataset.p];
  if(b.dataset.todo)copiar(bloque(p,"Texto de la publicación").texto+"\n\n"+bloque(p,"Hashtags").texto,b);
  else copiar(p.bloques[+b.dataset.b].texto,b);
});
buscar.addEventListener("input",pintar);
fetch("publicaciones.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
  pubs=d.sort(function(a,b){return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0});pintar();
}).catch(function(){lista.innerHTML='<p class="vacio">No se pudieron cargar las publicaciones. Revisa tu conexión y recarga.</p>'});
})();
</script>
</body>
</html>
